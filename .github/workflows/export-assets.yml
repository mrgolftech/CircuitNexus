name: Export CircuitNexus brand assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/**/*.svg'
      - 'tools/export_assets.py'
      - '.github/workflows/export-assets.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CJK fonts for Chinese design boards
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - name: Install render dependencies
        run: python -m pip install "pillow>=10,<13" "cairosvg>=2.7,<3"
      - name: Export transparent PNG, app ICO, Favicon and preview images
        run: python tools/export_assets.py
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/exports/
          if ! git diff --cached --quiet; then
            git commit -m "assets: refresh SVG-derived PNG/ICO exports [skip ci]"
            git push
          fi
