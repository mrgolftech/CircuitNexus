<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Schematic Review">
  <title>Schematic Review</title>
  <!-- Original artwork: a magnifier scanning a schematic net over a board outline. -->
  <defs>
    <clipPath id="lens">
      <circle cx="27" cy="27" r="15"/>
    </clipPath>
  </defs>

  <!-- Board outline with a corner mounting feature -->
  <rect x="5" y="5" width="54" height="54" rx="9"
        fill="none" stroke="currentColor" stroke-width="3" opacity="0.55"/>
  <circle cx="12.5" cy="12.5" r="2.2" fill="currentColor" opacity="0.55"/>

  <!-- Traces visible through the lens -->
  <g clip-path="url(#lens)" stroke="currentColor" stroke-width="2.6"
     fill="none" stroke-linecap="round">
    <path d="M12 22 H22 V34 H34"/>
    <path d="M18 40 H26 V28 H40"/>
    <path d="M14 30 H20"/>
    <circle cx="34" cy="34" r="2.6" fill="currentColor" stroke="none"/>
    <circle cx="26" cy="28" r="2.6" fill="currentColor" stroke="none"/>
  </g>

  <!-- Magnifier ring and handle -->
  <circle cx="27" cy="27" r="15" fill="none" stroke="currentColor" stroke-width="3.4"/>
  <line x1="38" y1="38" x2="52" y2="52" stroke="currentColor"
        stroke-width="5" stroke-linecap="round"/>
</svg>
